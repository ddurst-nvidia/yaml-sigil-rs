name: Publish

# This workflow distributes four crates.io source packages and creates their
# annotated tags plus source-only GitHub Releases. It builds, uploads, and
# retains no executable artifact.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions: {}

env:
  # Resolve the manifest's explicit `crates-io` publish allowlist by name.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable, so never cancel a run that may already have
# uploaded one source package while a replacement waits for approval.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate invocation
        env:
          EXPECTED_REPOSITORY: NVIDIA/yaml-sigil-rs
        run: |
          # Prevent a copied workflow from operating in another repository.
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "This workflow runs only in ${EXPECTED_REPOSITORY}." >&2
            exit 1
          fi
          # Official release authority belongs only to exact protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
            || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Official release operations must use exact main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: bash .github/scripts/install-release-tools.sh

      - name: Configure read-only release forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Require committed synchronized release versions
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Require the exact crates.io traits dependency
        run: bash .github/scripts/verify-release-traits.sh

      # `autobins = false` prevents implicit executable targets. Reject an
      # explicit `[[bin]]` target in every implementation package too.
      - name: Require library-only release packages in publication order
        run: |
          bash .github/scripts/check-release-packages.sh \
            yaml-sigil-core \
            yaml-sigil-transcription \
            yaml-sigil-signing \
            yaml-sigil-verification

      # Patch only unpublished implementation crates during dry-run validation.
      # The external traits package remains pinned to the named crates.io index.
      - name: Prepare unpublished workspace dependencies
        run: |
          validation_cargo_home="${RUNNER_TEMP}/yaml-sigil-rs-release-cargo-home"
          bash .github/scripts/prepare-unpublished-workspace-dependencies.sh \
            "${validation_cargo_home}"
          printf 'CARGO_HOME=%s\n' "${validation_cargo_home}" >>"${GITHUB_ENV}"

      - name: Package with Cargo
        run: |
          cargo package --package yaml-sigil-core --all-features
          cargo package --package yaml-sigil-transcription
          cargo package --package yaml-sigil-signing --all-features
          cargo package --package yaml-sigil-verification --all-features

      - name: Validate release-plz publication plan
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          # Exercise package ordering and forge discovery without OIDC or writes.
          release-plz release \
            --dry-run \
            --forge github \
            --config .release-plz.toml \
            --manifest-path Cargo.toml

  publication:
    name: Publish release
    if: ${{ inputs.operation == 'publish' }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      # Create version tags and source-only Releases after publication.
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: bash .github/scripts/install-release-tools.sh

      - name: Configure protected publication forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-release-git-user.sh

      - name: Recheck committed synchronized release versions
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Recheck the exact crates.io traits dependency
        run: bash .github/scripts/verify-release-traits.sh

      - name: Publish with Trusted Publishing
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          # Exchange only this protected job's OIDC identity, publish sources in
          # configured order, and create annotated tags and source-only Releases.
          release-plz release \
            --forge github \
            --config .release-plz.toml \
            --manifest-path Cargo.toml

      - name: Verify crates.io publication
        run: |
          bash .github/scripts/verify-crates-io-packages.sh \
            yaml-sigil-core \
            yaml-sigil-transcription \
            yaml-sigil-signing \
            yaml-sigil-verification

      - name: Request the next release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          jq --null-input --arg version "${version}" \
            '{event_type: "official-release-published", client_payload: {version: $version}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
