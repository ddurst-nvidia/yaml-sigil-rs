[package]
name = "yaml-sigil-signing"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Create signed YAML and protobuf documents"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "ed25519", "ecdsa"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
buffa = { workspace = true, default-features = false }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
thiserror = { version = "2", default-features = false }
tracing = { workspace = true, optional = true }
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["std"]
std = [
    "base64/std",
    "buffa/std",
    "dep:tracing",
    "ed25519-dalek/std",
    "p256/std",
    "thiserror/std",
    "yaml-sigil-core/std",
    "yaml-sigil-traits/std",
    "yaml-sigil-transcription/std",
]
json-schema-validate = ["std", "yaml-sigil-core/json-schema-validate"]
