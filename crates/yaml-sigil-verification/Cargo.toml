[package]
name = "yaml-sigil-verification"
version.workspace = true
authors.workspace = true
edition.workspace = true
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# This crate has no build script; keep automatic discovery disabled.
build = false
rust-version.workspace = true
description = "Verify documents and signatures"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "verification", "cryptography"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]

include = [
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
curve25519-dalek = { version = "4.1", default-features = false, features = [
    "alloc",
    "precomputed-tables",
    "zeroize",
] }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
sha2 = { version = "0.10", default-features = false }
signature = { version = "2.2", default-features = false }
tracing = { workspace = true }
yaml-sigil-core = { workspace = true, default-features = false }
yaml-sigil-traits = { workspace = true, default-features = false }
yaml-sigil-transcription = { workspace = true, default-features = false }

[features]
json-schema-validate = ["yaml-sigil-core/json-schema-validate"]

[dev-dependencies]
buffa = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["macros", "rt"] }
yaml-sigil-signing = { workspace = true }
